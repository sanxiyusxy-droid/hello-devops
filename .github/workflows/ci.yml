name: CI

# 什么时候触发流水线：
#   - 推到 main：跑测试 + 构建推送镜像
#   - 推 v* 标签：跑测试 + 构建带版本号的镜像（发布）
#   - 提 PR 到 main：只跑测试，作为合并前的门禁
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 准备 Node 环境
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm ci 严格按 package-lock.json 安装，保证 CI 和本地装出一样的依赖
      - name: 安装依赖
        run: npm ci

      - name: 跑测试
        run: npm test

  docker:
    name: 构建并推送镜像
    needs: test          # 测试不过就不构建，这就是"门禁"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # 推 GHCR 必须的权限
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      # 跨架构构建靠 QEMU：runner 是 x86 机器，靠它模拟出 arm64 环境
      - name: 准备 QEMU
        uses: docker/setup-qemu-action@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # GitHub 自动注入，不用自己配

      # 根据分支/标签自动算出镜像 tag，例如 :main、:1.0.0、:sha-abc1234
      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # 同时构建两种架构，manifest list 里就会有两项，Mac 和 x86 服务器都能直接拉
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 冒烟测试：把刚推上去的镜像真的拉起来，确认它能响应健康检查
      - name: 冒烟测试
        # 注意：不要把 ${{ }} 直接拼进 shell 命令，分支名等内容可被构造成恶意字符串。
        # 规范做法是先经 env 传入，再在脚本里加引号引用。
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE=$(echo "$IMAGE_TAGS" | head -n 1)
          echo "冒烟测试镜像：$IMAGE"
          docker run -d --name smoke -p 3000:3000 "$IMAGE"
          for i in $(seq 1 15); do
            if curl -fs http://localhost:3000/health; then
              echo ""
              echo "健康检查通过"
              exit 0
            fi
            sleep 2
          done
          echo "健康检查失败，容器日志："
          docker logs smoke
          exit 1
